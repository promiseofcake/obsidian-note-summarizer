name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Verify tag matches manifest and versions.json
        run: |
          node -e "
            const t = process.env.GITHUB_REF_NAME;
            const v = require('./manifest.json').version;
            if (t !== v) { console.error('Tag ' + t + ' != manifest version ' + v); process.exit(1); }
            if (!(t in require('./versions.json'))) { console.error('Tag ' + t + ' missing from versions.json'); process.exit(1); }
          "

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify release assets
        run: |
          test -f main.js
          test -f manifest.json

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          assets=(main.js manifest.json)
          # GitHub rejects empty uploads (HTTP 400), so attach styles.css only when it has content
          if [ -s styles.css ]; then assets+=(styles.css); fi
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            --draft \
            "${assets[@]}"
